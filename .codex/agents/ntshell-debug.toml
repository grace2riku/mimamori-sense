## Issueごとの対応方針\r
\r
### S-007-2: NT-Shellライブラリの組み込み・初期化処理\r
\r
- NT-Shellライブラリのソースコードをプロジェクトに組み込む\r
  - リファレンスプロジェクトからNT-Shellライブラリのソースを特定する\r
  - `e2studio_CPU0/src/` 配下の適切な場所に配置する\r
- NT-Shell初期化関数を実装する:\r
  - `ntshell_init()`: NT-Shellインスタンスの初期化\r
  - UART（SCI）ドライバとの接続（文字送受信コールバック）\r
  - プロンプト文字列の設定\r
- JLink RTT Console との使い分け:\r
  - 既存の `jlink_console.c` はJLink RTT経由のコンソール出力\r
  - NT-ShellはUART（SCI）経由の双方向コンソール\r
  - 両方を共存させる設計にする\r
\r
### S-007-3: NT-Shell用FreeRTOSスレッドの作成\r
\r
- `ntshell_thread_entry.c` を作成する（既存のファイルがあればそれを使用）\r
- FreeRTOSスレッドのエントリ関数を実装する:\r
  - NT-Shell初期化\r
  - メインループ: `ntshell_execute()` の呼び出し（UARTからの文字入力を処理）\r
- スレッド優先度: 通常（他のリアルタイムタスクより低め）\r
- スタックサイズ: 4096バイト（コマンド実行に十分なサイズ）\r
\r
### S-007-4: NT-Shellコマンド登録フレームワーク\r
\r
- コマンドテーブル (`cmdlist[]`) の構造を実装する:\r
  ```c\r
  typedef struct {\r
      const char *cmd;    // コマンド名\r
      const char *desc;   // ヘルプ文字列\r
      int (*func)(int argc, char **argv);  // コマンド関数\r
  } cmd_table_t;\r
  ```\r
- 基本コマンドを実装する:\r
  - `help`: コマンド一覧表示\r
  - `info`: システム情報表示（FSPバージョン、FreeRTOSバージョン、ビルド日時等）\r
- コマンドディスパッチャー: 入力文字列をパースしてコマンドテーブルから検索・実行\r
- 配置先: `e2studio_CPU0/src/usrcmd.c`（既存ファイルがあればそこに追加）\r
\r
### S-008: メモリリードコマンド（mr）\r
\r
- 指定アドレスから指定サイズのメモリ内容を読み出し表示するコマンド\r
- 使用方法: `mr <address> [size]`\r
  - `address`: 16進数アドレス（例: `0x20000000`）\r
  - `size`: 読み出しサイズ（デフォルト: 4バイト）、1/2/4バイト指定\r
- 表示形式: `0x20000000: 0x12345678`\r
- アドレスのアライメントチェックを実装する\r
- 不正アドレスアクセスによるHardFault防止のため、アクセス可能範囲を検証する\r
\r
### S-009: メモリダンプコマンド（md）\r
\r
- 指定アドレスから指定サイズのメモリ内容を16進ダンプ表示するコマンド\r
- 使用方法: `md <address> [length]`\r
  - `address`: 16進数アドレス\r
  - `length`: ダンプ長（デフォルト: 256バイト）\r
- 表示形式（一般的なhexdump形式）:\r
  ```\r
  0x20000000: 12 34 56 78 9A BC DE F0  01 23 45 67 89 AB CD EF  .4Vx.....#Eg....\r
  0x20000010: ...\r
  ```\r
- 16バイト/行で表示\r
- 右側にASCII表示（印刷可能文字以外は `.`）\r
\r
### S-010: メモリライトコマンド（mw）\r
\r
- 指定アドレスに指定値を書き込むコマンド\r
- 使用方法: `mw <address> <value> [size]`\r
  - `address`: 16進数アドレス\r
  - `value`: 書き込み値（16進数）\r
  - `size`: 書き込みサイズ（デフォルト: 4バイト）、1/2/4バイト指定\r
- 書き込み前に現在の値を表示し、書き込み後に確認読み出しを行う\r
- 安全性: 重要レジスタ領域への書き込みはユーザー確認を促す注意メッセージを表示する\r
\r
### S-011: LED制御コマンド（led）\r
\r
- 指定LEDのON/OFF制御コマンド\r
- 使用方法: `led <number> <on|off|toggle|status>`\r
  - `number`: LED番号（ボード上のLED番号）\r
  - `on`: LED点灯\r
  - `off`: LED消灯\r
  - `toggle`: LED状態反転\r
  - `status`: 全LEDの現在状態表示\r
- EK-RA8P1ボード上のユーザーLED（BSP_LED_*）のGPIO制御\r
- FSPの `R_IOPORT_PinWrite()` または BSP LED API を使用する\r
- LED番号とGPIOピンの対応表を実装内にコメントで記載する\r
\r
## UART通信の設計\r
\r
### NT-Shell用UART\r
\r
```\r
EK-RA8P1ボード\r
  → SCI UART (FSPモジュール)\r
  → USB-シリアル変換 / PMOD等\r
  → PC側ターミナル（TeraTerm, PuTTY等）\r
```\r
\r
### 文字送受信インターフェース\r
\r
```c\r
// NT-Shellが必要とするインターフェース\r
// UART受信: 1文字受信（ブロッキング）\r
int ntshell_serial_read(char *buf, int cnt, void *extobj);\r
\r
// UART送信: 1文字送信\r
int ntshell_serial_write(const char *buf, int cnt, void *extobj);\r
\r
// コマンドコールバック: ユーザーがEnterキーを押した時に呼ばれる\r
int ntshell_callback(const char *text, void *extobj);\r
```\r
\r
## コーディング規約\r
\r
### ファイル配置\r
- NT-Shellスレッド: `e2studio_CPU0/src/ntshell_thread_entry.c`\r
- コマンド実装: `e2studio_CPU0/src/usrcmd.c`\r
- NT-Shellライブラリ: `e2studio_CPU0/src/ntshell/` 等（リファレンスの配置に合わせる）\r
- UART接続: `e2studio_CPU0/src/` 配下\r
\r
### コーディングスタイル\r
- 既存コード（`jlink_console.c`, `usrcmd.c`等）のスタイルに合わせる\r
- コマンド関数名: `usrcmd_<コマンド名>` 形式（例: `usrcmd_mr`, `usrcmd_md`, `usrcmd_mw`, `usrcmd_led`）\r
- ヘッダガード: `#ifndef ファイル名_H`, `#define ファイル名_H`\r
- コメント: 関数の先頭に機能説明を記載\r
\r
### コマンド実装パターン\r
\r
```c\r
// S-008: メモリリードコマンドの実装例\r
static int usrcmd_mr(int argc, char **argv)\r
{\r
    if (argc < 2) {\r
        print_to_console("Usage: mr <address> [size(1|2|4)]\\r\\n");\r
        return 0;\r
    }\r
\r
    uint32_t addr = (uint32_t)strtoul(argv[1], NULL, 0);\r
    int size = (argc >= 3) ? atoi(argv[2]) : 4;\r
\r
    // アドレスアライメントチェック\r
    if (addr % size != 0) {\r
        print_to_console("Error: address not aligned\\r\\n");\r
        return -1;\r
    }\r
\r
    // メモリ読み出し・表示\r
    switch (size) {\r
        case 1: {\r
            uint8_t val = *(volatile uint8_t *)addr;\r
            print_to_console("0x%08lX: 0x%02X\\r\\n", addr, val);\r
            break;\r
        }\r
        case 2: {\r
            uint16_t val = *(volatile uint16_t *)addr;\r
            print_to_console("0x%08lX: 0x%04X\\r\\n", addr, val);\r
            break;\r
        }\r
        case 4: {\r
            uint32_t val = *(volatile uint32_t *)addr;\r
            print_to_console("0x%08lX: 0x%08lX\\r\\n", addr, val);\r
            break;\r
        }\r
    }\r
    return 0;\r
}\r
```\r
\r
## 注意事項\r
\r
- コマンド実行はntshell_threadから行われる\r
- メモリアクセスコマンド（mr/md/mw）は不正アドレスアクセスによるHardFaultに注意する\r
  - 可能であればMPU設定でアクセス可能範囲を確認する\r
  - 最低限、NULLポインタ付近へのアクセスを拒否する\r
- LED制御はGPIO操作のため、他スレッドとのGPIO競合に注意する\r
- 出力は `print_to_console()` を使用する（`jlink_console.h`）\r
- 文字列比較は `ntlibc_strcmp()` を使用する（`ntlibc.h`）\r
- 数値変換は `strtoul()` 等の標準関数を使用する\r
\r
## 制約事項\r
\r
- configuration.xmlを直接編集してはならない\r
- ra_gen/ 配下の自動生成コードを編集してはならない\r
- ra/fsp/ 配下のFSPライブラリを編集してはならない\r
- FSPの設定変更が必要な場合はユーザーに具体的な変更内容を伝えること"""

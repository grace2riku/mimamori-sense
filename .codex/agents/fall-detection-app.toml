   - 共通ユーティリティ: `reference_projects/ruhmi-framework-mcu/application_examples/face_detection/src/common_util.c/.h`\r
   - 解析レポート: `doc/analysis_report/ruhmi_framework_mcu_face_detection_analysis.md`\r

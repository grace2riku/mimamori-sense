## NT-Shellコマンドによる動作確認\r
\r
実装した機能の動作確認・デバッグのために、積極的にNT-Shellコマンドを追加すること。\r
コマンドは `e2studio_CPU0/src/usrcmd.c` の `cmdlist[]` テーブルに登録する。\r
\r
### コマンド追加パターン\r
\r
```c\r
// 1. 関数のforward declaration（usrcmd.c上部）\r
static int usrcmd_fall(int argc, char **argv);\r
\r
// 2. cmdlist[]テーブルに登録\r
static const cmd_table_t cmdlist[] = {\r
    ...\r
    { "fall", "fall detection control", usrcmd_fall },\r
};\r
\r
// 3. コマンド関数の実装\r
static int usrcmd_fall(int argc, char **argv)\r
{\r
    if (argc < 2) {\r
        print_to_console("Usage: fall <subcommand>\\r\\n");\r
        return 0;\r
    }\r
    if (ntlibc_strcmp(argv[1], "status") == 0) {\r
        // サブコマンド処理\r
    }\r
    return 0;\r
}\r
```\r
\r
### 推奨コマンド例\r
\r
| Issue | コマンド | サブコマンド | 用途 |\r
|---|---|---|---|\r
| F-003-9 | `fall` | `fall status` | 転倒検出状態表示（NORMAL/SUSPECTED/CONFIRMED/COOLDOWN） |\r
| F-003-9 | `fall` | `fall count` | 連続検出カウンター、転倒確定回数の累計表示 |\r
| F-003-9 | `fall` | `fall threshold` | 現在の閾値パラメータ一覧表示（アスペクト比閾値、連続回数、クールダウン時間） |\r
| F-003-9 | `fall` | `fall set <param> <value>` | 閾値パラメータのランタイム変更（デバッグ・チューニング用） |\r
| F-003-9 | `fall` | `fall reset` | 転倒検出状態をNORMALにリセット |\r
| F-003-10 | `fall` | `fall display` | 画面表示の状態確認（表示ON/OFF、描画FPS） |\r
| F-003-11 | `fall` | `fall kpi` | KPI計測結果表示（推論時間、検出率、誤検出率の直近統計） |\r
| F-003-11 | `fall` | `fall log` | 直近N件の検出イベントログ表示（タイムスタンプ、状態遷移履歴） |\r
\r
### ランタイムパラメータ調整の重要性\r
\r
転倒検出の精度チューニングでは以下のパラメータを実機上で繰り返し調整する必要がある。\r
`fall set` コマンドによるランタイム変更を実装することで、ファームウェアの再ビルド・書き込みなしにパラメータ調整が可能になり、開発効率が大幅に向上する。\r
\r
- アスペクト比閾値（転倒候補判定）\r
- 検出スコア閾値\r
- 連続検出回数（時系列フィルタ）\r
- クールダウン時間\r
\r
### 注意事項\r
\r
- コマンド実行はntshell_threadから行われるため、転倒検出ロジックのデータにアクセスする際はスレッドセーフに注意する\r
- 状態遷移のログ出力は循環バッファ（リングバッファ）に記録しておくと `fall log` で参照しやすい\r
- 出力は `print_to_console()` を使用する（`jlink_console.h`）\r
- 文字列比較は `ntlibc_strcmp()` を使用する（`ntlibc.h`）\r
\r
## 制約事項\r

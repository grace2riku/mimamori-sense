4. Issue内容に基づいて実装する\r
\r
## Issueごとの対応方針\r
\r
### F-003-9: 転倒判定ロジックの実装\r
\r
AI推論の検出結果（バウンディングボックス、スコア）から「転倒確定」を判定する状態マシンを実装する。\r
\r
#### 状態遷移図\r
\r
```\r
              転倒候補検出\r
  NORMAL ─────────────────> SUSPECTED\r
    ^                          │\r
    │ 候補途切れ                │ 連続検出回数 ≥ 閾値\r
    └──────────────────────────┤\r
                               ▼\r
              通知完了      CONFIRMED\r
  NORMAL <── COOLDOWN <────────┘\r
          期間終了        F-004通知イベント発行\r
```\r
\r
#### 実装内容\r
- `fall_detection_logic.c/.h` を新規作成\r
- 転倒状態列挙型（NORMAL, SUSPECTED, CONFIRMED, COOLDOWN）\r
- 状態遷移関数: 毎フレームの検出結果を入力とし、現在の状態を更新\r
- 転倒候補判定:\r
  - アプローチA/C: バウンディングボックスのアスペクト比（width/height）が閾値超過\r
  - アプローチB: 「転倒」クラスの検出スコアが閾値超過\r
- 時系列フィルタ: 連続N回の検出で確定（単発の誤検出を除去）\r
- クールダウン: 転倒確定後、一定時間は再検出しない\r
- 各種閾値はマクロ定数で調整可能にする\r
- 転倒確定時のイベント通知インターフェース定義（F-004連携用）\r
- 配置先: `e2studio_CPU0/src/`\r
\r
### F-003-10: LCD画面表示の実装\r
\r
転倒検出結果をLCD（1024x600, RGB565）にD/AVE 2Dで描画する。\r
\r
#### 表示要素\r
- カメラ映像のスケーリング表示（320x240 → 表示領域）\r
- バウンディングボックス描画（状態別色分け: 緑=通常, 黄=疑い, 赤=確定）\r
- 転倒状態テキスト（"Monitoring..." / "Fall Suspected" / "FALL DETECTED"）\r
- 情報パネル（推論時間, 検出人数, 状態, FPS）\r
\r
#### 実装内容\r
- リファレンスの `face_detection_screen_mipi.c` をベースに `fall_detection_screen_mipi.c` を作成\r
- D/AVE 2D API使用:\r
  - `d2_setblitsrc()` / `d2_blitcopy()`: カメラ画像描画\r
  - `d2_renderline()`: バウンディングボックス矩形描画\r
  - `d2_setcolor()`: 状態別色設定\r
  - テキスト描画関数: 状態・情報表示\r
- GLCDC VSYNC同期（ティアリング防止）\r
- `camera_display_thread_entry.c` のメインループに統合\r
- 配置先: `e2studio_CPU0/src/display_layer/`\r
\r
### F-003-11: 結合テスト・KPI達成確認\r
\r
F-003全体のEnd-to-End動作確認とKPI計測手順を文書化する。\r
\r
#### KPI（product-requirements.md）\r
\r
| KPI | 目標値 |\r
|---|---|\r
| AI推論時間 | ≤ 5ms |\r
| 転倒検出率 | ≥ 90% |\r
| 誤検出率 | ≤ 5% |\r
| 転倒検出→通知時間 | ≤ 10秒 |\r
\r
#### 実装内容\r
- コンソール出力に各処理時間の計測結果を表示するコードを追加\r
  - 前処理時間、NPU推論時間、後処理時間、合計処理時間\r
- テストシナリオ一覧と実行手順を文書化\r
- KPI計測用のデバッグ出力機能を実装\r
- パフォーマンス最適化のガイドライン（KPI未達時の対策）を文書化\r
- 成果物（テスト手順書・KPIレポートテンプレート）: `doc/` 配下に配置\r
- 計測用コード: `e2studio_CPU0/src/`\r
\r
## D/AVE 2D描画API リファレンス\r
\r
リファレンスの`face_detection_screen_mipi.c`で使用されている主要API:\r
\r
| API | 用途 |\r
|---|---|\r
| `d2_startframe(d2_handle)` | フレーム描画開始 |\r
| `d2_endframe(d2_handle)` | フレーム描画終了 |\r
| `d2_setblitsrc(d2_handle, src, pitch, w, h, fmt)` | BLITソース設定 |\r
| `d2_blitcopy(d2_handle, sw, sh, ...)` | スケーリングBLIT描画 |\r
| `d2_setcolor(d2_handle, idx, color)` | 描画色設定 |\r
| `d2_renderline(d2_handle, x1, y1, x2, y2, w, flags)` | 線描画（矩形の辺に使用） |\r
| `d2_settexture(...)` / `d2_settexturemode(...)` | テクスチャ描画（テキスト用） |\r
| `R_GLCDC_BufferChange(ctrl, fb, layer)` | ダブルバッファ切り替え |\r
\r

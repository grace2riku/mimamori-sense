# YOLOv8n-Grayscale: 転倒検出用 Grayscale入力モデル
# Issue #103 (F-003-3c)
#
# YOLOv8n 構成をベースに入力チャネルのみ 3ch -> 1ch に変更。
# COCO事前学習済み重み (yolov8n.pt) を転移学習のベースとして使用する場合、
# 最初の Conv 層の重みは ch=1 に自動調整される（Ultralytics が処理）。
#
# パラメータ数: YOLOv8n (3.0M) とほぼ同等（最初のConv層のみ差異）
# 入力: 192x192x1 (Grayscale, INT8)
#
# 変更点 (YOLOv8n デフォルトからの差分):
#   - ch: 3 -> 1 (Grayscale入力, F-003-3c対応)
#   - nc: 80 -> 1 (personクラスのみ)

# Parameters
nc: 1  # number of classes (person only)
ch: 1  # input channels (Grayscale)

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n 標準構成

# YOLOv8 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 9

# YOLOv8 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]       # cat backbone P4
  - [-1, 3, C2f, [512]]             # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]       # cat backbone P3
  - [-1, 3, C2f, [256]]             # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]      # cat head P4
  - [-1, 3, C2f, [512]]             # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]       # cat head P5
  - [-1, 3, C2f, [1024]]            # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
